name: Android trial APK
on:
  push:
    paths: ['android/**', 'dist/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify game engine
        run: node test.cjs
      - name: Build and lint
        run: gradle -p android assembleDebug lintDebug --no-daemon
      - name: Prepare APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk runners-high-0.1.0-trial.apk
          sha256sum runners-high-0.1.0-trial.apk > runners-high-0.1.0-trial.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: runners-high-trial
          path: |
            runners-high-0.1.0-trial.apk
            runners-high-0.1.0-trial.apk.sha256
            android/app/build/reports/lint-results-debug.html
      - name: Publish test download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-trial-${{ github.run_number }}" runners-high-0.1.0-trial.apk runners-high-0.1.0-trial.apk.sha256 --target "${{ github.sha }}" --prerelease --title "Android trial build ${{ github.run_number }}" --notes "Offline test APK for Android 8+. Debug-signed test build, not a Play Store release. Web saves do not transfer. Future trial builds may require reinstall because CI debug signing keys are temporary. Device testing is still required."
